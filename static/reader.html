<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>읽는 중...</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="웹툰">
<link rel="stylesheet" href="/style.css">
</head>
<body class="reader-body">
<header class="reader-topbar" id="topbar">
  <a class="back" id="backLink" href="/">←</a>
  <span id="chapterTitle"></span>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="회차 목록" title="회차 목록">≡</button>
  <button class="reader-control" id="fullscreenToggle" aria-label="전체 화면" title="전체 화면">
    <svg id="fullscreenEnterIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="8 3 3 3 3 8"></polyline>
      <polyline points="16 3 21 3 21 8"></polyline>
      <polyline points="8 21 3 21 3 16"></polyline>
      <polyline points="16 21 21 21 21 16"></polyline>
    </svg>
    <svg id="fullscreenExitIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
      <polyline points="9 3 9 9 3 9"></polyline>
      <polyline points="15 3 15 9 21 9"></polyline>
      <polyline points="9 21 9 15 3 15"></polyline>
      <polyline points="15 21 15 15 21 15"></polyline>
    </svg>
  </button>
  <button class="reader-control speed-control" id="scrollSpeedToggle" aria-label="스크롤 속도" title="스크롤 속도">1x</button>
</header>

<div id="pages" class="pages"></div>
<div id="positioningOverlay" class="positioning-overlay" style="display:none">이어보던 위치로 이동 중…</div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span id="sidebarTitle">회차 목록</span>
    <button id="sidebarClose" class="sidebar-close" aria-label="닫기">×</button>
  </div>
  <div id="sidebarList" class="sidebar-list"></div>
</aside>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<script>
const params = new URLSearchParams(location.search);
const seriesId = params.get("series");
const initialChapterId = params.get("chapter");
const initialPage = parseInt(params.get("page") || "0", 10) || 0;

document.getElementById("backLink").href = "/";

let seriesData = null;       // { title, platform, chapters: [...] } (오름차순)
let loadedChapters = [];     // 이 화면에 이미 붙인 회차들 (진행 순서대로)
let currentChapterId = null;
let currentPageIndex = 0;
let isLoadingNext = false;
let saveTimer = null;

// 리더 화면별 UI 설정. 전체 화면 상태는 웹툰(seriesId) 단위로 저장한다.
const FULLSCREEN_SETTING_PREFIX = "reader_fullscreen:";
const SCROLL_SPEED_SETTING_KEY = "reader_scroll_speed";
const SCROLL_SPEEDS = [0.5, 1, 1.5, 2, 3];
const DEFAULT_SCROLL_SPEED = 1;
const SCROLL_PIXELS_PER_SECOND = 650;
let scrollSpeed = DEFAULT_SCROLL_SPEED;
let scrollAnimationFrame = null;
let scrollDirection = 0;
let fullscreenPreference = false;

const pagesEl = document.getElementById("pages");
const chapterTitleEl = document.getElementById("chapterTitle");
const sidebarListEl = document.getElementById("sidebarList");
const fullscreenToggleEl = document.getElementById("fullscreenToggle");
const fullscreenEnterIconEl = document.getElementById("fullscreenEnterIcon");
const fullscreenExitIconEl = document.getElementById("fullscreenExitIcon");
const scrollSpeedToggleEl = document.getElementById("scrollSpeedToggle");

function showError() {
  pagesEl.innerHTML = `<div class="empty-state">회차를 불러올 수 없습니다.</div>`;
}

let positioningTimer = null;
const positioningOverlayEl = document.getElementById("positioningOverlay");

function beginPositioning() {
  pagesEl.classList.add("positioning");
  positioningOverlayEl.style.display = "flex";
}

function revealPages() {
  clearTimeout(positioningTimer);
  pagesEl.classList.remove("positioning");
  positioningOverlayEl.style.display = "none";
}

function chapterById(id) {
  return seriesData.chapters.find((c) => c.id === id) || null;
}

function chapterIndexById(id) {
  return seriesData.chapters.findIndex((c) => c.id === id);
}

// ---------------------------------------------------------------------
// 리더 화면 설정: 회차별 전체 화면 + 연속 스크롤
// ---------------------------------------------------------------------

function fullscreenSettingKey() {
  return `${FULLSCREEN_SETTING_PREFIX}${seriesId}`;
}

async function readFullscreenPreference() {
  // 서버 설정을 우선 사용하되, 서버에 값이 없거나 요청에 실패하면
  // 기존 브라우저의 localStorage 값도 사용할 수 있게 한다.
  const localValue = localStorage.getItem(fullscreenSettingKey());
  if (localValue !== null) fullscreenPreference = localValue === "1";

  try {
    const res = await fetch(`/api/settings/${encodeURIComponent(fullscreenSettingKey())}`);
    if (res.ok) {
      const data = await res.json();
      if (data.value === "1" || data.value === "0") {
        fullscreenPreference = data.value === "1";
        localStorage.setItem(fullscreenSettingKey(), data.value);
      }
    }
  } catch (e) {
    // 서버 설정을 읽지 못해도 로컬 설정으로 계속 사용할 수 있다.
  }
}

async function writeFullscreenPreference(enabled) {
  fullscreenPreference = enabled;
  localStorage.setItem(fullscreenSettingKey(), enabled ? "1" : "0");
  try {
    await fetch(`/api/settings/${encodeURIComponent(fullscreenSettingKey())}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: enabled ? "1" : "0" }),
    });
  } catch (e) {
    // 로컬 저장은 이미 끝났으므로 서버 저장 실패가 리더 사용을 막지 않게 한다.
  }
}

function updateFullscreenButton() {
  const active = document.body.classList.contains("reader-fullscreen");
  fullscreenEnterIconEl.style.display = active ? "none" : "block";
  fullscreenExitIconEl.style.display = active ? "block" : "none";
  fullscreenToggleEl.setAttribute("aria-label", active ? "전체 화면 해제" : "전체 화면");
  fullscreenToggleEl.title = active ? "전체 화면 해제" : "전체 화면";
}

async function enterBrowserFullscreen() {
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
    try {
      await document.documentElement.requestFullscreen();
    } catch (e) {
      // 브라우저 보안 정책상 사용자 제스처가 필요한 경우가 있으므로
      // 아래의 앱 전체 화면 모드는 그대로 유지한다.
    }
  }
}

async function exitBrowserFullscreen() {
  if (document.fullscreenElement && document.exitFullscreen) {
    try {
      await document.exitFullscreen();
    } catch (e) {}
  }
}

function setReaderFullscreen(enabled, { persist = true, requestBrowserFullscreen = false } = {}) {
  document.body.classList.toggle("reader-fullscreen", enabled);
  if (persist) writeFullscreenPreference(enabled);
  updateFullscreenButton();

  if (enabled && requestBrowserFullscreen) {
    enterBrowserFullscreen();
  } else if (!enabled) {
    exitBrowserFullscreen();
  }
}

fullscreenToggleEl.addEventListener("click", () => {
  const enabled = !document.body.classList.contains("reader-fullscreen");
  setReaderFullscreen(enabled, { persist: true, requestBrowserFullscreen: enabled });
});

document.addEventListener("fullscreenchange", () => {
  // Esc 등으로 브라우저 전체 화면을 빠져나와도 사용자가 저장한
  // 웹툰별 전체 화면 선호 상태는 유지한다. 따라서 다음 진입 때 다시 적용한다.
  updateFullscreenButton();
});

async function leaveReaderForList(event) {
  if (event) event.preventDefault();
  // 웹툰 목록으로 돌아갈 때는 브라우저 전체 화면과 리더 전체 화면을 모두 해제한다.
  document.body.classList.remove("reader-fullscreen");
  await exitBrowserFullscreen();
  updateFullscreenButton();
  window.location.href = "/";
}

document.getElementById("backLink").addEventListener("click", leaveReaderForList);

function loadScrollSpeed() {
  const stored = parseFloat(localStorage.getItem(SCROLL_SPEED_SETTING_KEY) || "");
  if (SCROLL_SPEEDS.includes(stored)) scrollSpeed = stored;
  scrollSpeedToggleEl.textContent = `${scrollSpeed}x`;
}

function saveScrollSpeed() {
  localStorage.setItem(SCROLL_SPEED_SETTING_KEY, String(scrollSpeed));
}

function cycleScrollSpeed() {
  const index = SCROLL_SPEEDS.indexOf(scrollSpeed);
  scrollSpeed = SCROLL_SPEEDS[(index + 1) % SCROLL_SPEEDS.length];
  scrollSpeedToggleEl.textContent = `${scrollSpeed}x`;
  scrollSpeedToggleEl.title = `스크롤 속도 ${scrollSpeed}x (클릭하여 변경)`;
  saveScrollSpeed();
}

scrollSpeedToggleEl.addEventListener("click", (event) => {
  event.stopPropagation();
  cycleScrollSpeed();
});

function stopContinuousScroll() {
  scrollDirection = 0;
  if (scrollAnimationFrame !== null) {
    cancelAnimationFrame(scrollAnimationFrame);
    scrollAnimationFrame = null;
  }
}

function startContinuousScroll(direction) {
  if (scrollDirection === direction && scrollAnimationFrame !== null) return;
  scrollDirection = direction;
  let lastTime = performance.now();

  const step = (now) => {
    if (scrollDirection !== direction) {
      scrollAnimationFrame = null;
      return;
    }
    const elapsed = Math.min(now - lastTime, 50) / 1000;
    lastTime = now;
    window.scrollBy(0, direction * SCROLL_PIXELS_PER_SECOND * scrollSpeed * elapsed);
    scrollAnimationFrame = requestAnimationFrame(step);
  };

  if (scrollAnimationFrame !== null) cancelAnimationFrame(scrollAnimationFrame);
  scrollAnimationFrame = requestAnimationFrame(step);
}

function scrollOnce(direction) {
  stopContinuousScroll();
  window.scrollBy(0, direction * Math.max(window.innerHeight * 0.85, 300));
}

function handleScrollKeyDown(event) {
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.ctrlKey || event.metaKey || event.altKey) {
    return;
  }

  let direction = 0;
  if (event.key === "ArrowUp" || event.key === "PageUp" || event.key === "AudioVolumeDown") direction = -1;
  if (event.key === "ArrowDown" || event.key === "PageDown" || event.key === "AudioVolumeUp") direction = 1;
  if (!direction) return;

  event.preventDefault();
  startContinuousScroll(direction);
}

function handleScrollKeyUp(event) {
  if (
    event.key === "ArrowUp" || event.key === "PageUp" || event.key === "AudioVolumeDown" ||
    event.key === "ArrowDown" || event.key === "PageDown" || event.key === "AudioVolumeUp"
  ) {
    event.preventDefault();
    stopContinuousScroll();
  }
}

window.addEventListener("keydown", handleScrollKeyDown, { passive: false });
window.addEventListener("keyup", handleScrollKeyUp, { passive: false });
window.addEventListener("blur", stopContinuousScroll);

loadScrollSpeed();

// ---------------------------------------------------------------------
// 회차 로딩 (무한 스크롤)
// ---------------------------------------------------------------------

const loadMoreObserver = new IntersectionObserver(
  (entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) loadNextChapter();
    }
  },
  { rootMargin: "0px 0px 1200px 0px" }
);

const pageObserver = new IntersectionObserver(
  (entries) => {
    for (const entry of entries) {
      const key = entry.target.dataset.key;
      if (entry.isIntersecting) {
        visiblePages.set(key, entry.target);
      } else {
        visiblePages.delete(key);
      }
    }
    updateCurrentFromVisible();
  },
  { threshold: 0.4 }
);

const visiblePages = new Map();

function updateCurrentFromVisible() {
  if (visiblePages.size === 0) return;
  let top = null;
  for (const el of visiblePages.values()) {
    const rect = el.getBoundingClientRect();
    if (!top || rect.top < top.rect.top) top = { el, rect };
  }
  const chapterId = top.el.dataset.chapter;
  const pageIndex = parseInt(top.el.dataset.page, 10);
  if (chapterId !== currentChapterId || pageIndex !== currentPageIndex) {
    currentChapterId = chapterId;
    currentPageIndex = pageIndex;
    onPositionChange();
  }
}

function onPositionChange() {
  const ch = chapterById(currentChapterId);
  chapterTitleEl.textContent = ch ? `${seriesData.title} · ${ch.label}` : seriesData.title;
  highlightSidebar();
  scheduleSaveProgress();
}

function saveProgressNow({ keepalive = false } = {}) {
  if (!currentChapterId) return;

  clearTimeout(saveTimer);
  saveTimer = null;

  const chapterId = currentChapterId;
  const pageIndex = currentPageIndex;
  return fetch(`/api/series/${encodeURIComponent(seriesId)}/progress`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chapter_id: chapterId, page_index: pageIndex }),
    keepalive,
  }).catch(() => {});
}

function scheduleSaveProgress() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    saveProgressNow();
  }, 1200);
}

// 마지막 회차에는 다음 회차 진입 이벤트가 없으므로, 실제 문서의 끝에
// 도달했을 때 마지막 이미지까지 읽은 것으로 한 번 더 확정한다.
// 기존 IntersectionObserver 기반 페이지 판정은 그대로 유지하고,
// 문서 끝에서만 누락 가능성을 보완한다.
let endOfDocumentCheckQueued = false;
function confirmLastChapterAtDocumentEnd() {
  if (endOfDocumentCheckQueued) return;
  endOfDocumentCheckQueued = true;
  requestAnimationFrame(() => {
    endOfDocumentCheckQueued = false;

    if (!seriesData || !currentChapterId) return;
    if (currentChapterId !== seriesData.chapters[seriesData.chapters.length - 1]?.id) return;

    const bottomGap = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
    if (bottomGap > 24) return;

    const lastChapter = seriesData.chapters[seriesData.chapters.length - 1];
    const lastImage = pagesEl.querySelector(`img[data-chapter="${CSS.escape(lastChapter.id)}"]:last-of-type`);
    if (!lastImage) return;

    const lastPageIndex = parseInt(lastImage.dataset.page, 10);
    if (!Number.isFinite(lastPageIndex)) return;

    const changed = currentChapterId !== lastChapter.id || currentPageIndex !== lastPageIndex;
    currentChapterId = lastChapter.id;
    currentPageIndex = lastPageIndex;
    if (changed) {
      const ch = chapterById(currentChapterId);
      chapterTitleEl.textContent = ch ? `${seriesData.title} · ${ch.label}` : seriesData.title;
      highlightSidebar();
      updateUrlState(currentChapterId, currentPageIndex);
    }

    // 마지막 회차의 마지막 페이지에 도달한 순간에는 debounce를 기다리지 않고
    // 즉시 저장한다. 서버의 기존 마지막 회차 read_chapters 판정은 그대로 사용한다.
    saveProgressNow({ keepalive: true });
  });
}

window.addEventListener("scroll", confirmLastChapterAtDocumentEnd, { passive: true });
window.addEventListener("pagehide", () => {
  // 목록 이동/뒤로가기 등으로 reader가 종료되기 전에 남아 있는 진행률을
  // 기존 저장 API로 즉시 한 번 전송한다. 서버/DB 구조는 변경하지 않는다.
  saveProgressNow({ keepalive: true });
});

// ---------------------------------------------------------------------
// 프리페치 (다음 화 이미지를 미리 브라우저 캐시에 받아둠)
// ---------------------------------------------------------------------

const PREFETCH_PAGE_LIMIT = 6; // 다음 화 앞부분 몇 장만 미리 받음 (데이터 절약)
const prefetchedChapterIds = new Set();

function prefetchImages(urls) {
  for (const url of urls) {
    const img = new Image();
    img.fetchPriority = "low"; // 지금 보고 있는 화면의 로딩을 방해하지 않도록
    img.src = url;
  }
}

async function prefetchNextChapter(afterChapterId) {
  const idx = chapterIndexById(afterChapterId);
  const next = idx >= 0 ? seriesData.chapters[idx + 1] : null;
  if (!next || prefetchedChapterIds.has(next.id)) return;
  prefetchedChapterIds.add(next.id);

  // 겹침 계산은 서버에서 시간이 걸릴 수 있으니(첫 계산 시), 실제로 필요해지기 전에
  // 미리 요청만 던져서 캐싱해둔다 (결과는 여기서 안 기다림)
  fetch(`/api/chapters/${encodeURIComponent(next.id)}/overlap`).catch(() => {});

  try {
    const res = await fetch(`/api/chapters/${encodeURIComponent(next.id)}/pages`);
    const data = await res.json();
    const pageCount = Math.min(data.page_count || 0, PREFETCH_PAGE_LIMIT);
    const urls = [];
    for (let i = 0; i < pageCount; i++) {
      urls.push(`/api/chapters/${encodeURIComponent(next.id)}/pages/${i}`);
    }
    prefetchImages(urls);
  } catch (e) {
    prefetchedChapterIds.delete(next.id); // 실패하면 나중에 다시 시도할 수 있게
  }
}

async function revealSkippedPages(chapter, skipCount, wrapEl) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < skipCount; i++) {
    const img = document.createElement("img");
    img.dataset.chapter = chapter.id;
    img.dataset.page = String(i);
    img.dataset.key = `${chapter.id}:${i}`;
    img.src = `/api/chapters/${encodeURIComponent(chapter.id)}/pages/${i}`;
    img.alt = `${i + 1}페이지`;
    pageObserver.observe(img);
    frag.appendChild(img);
  }
  wrapEl.replaceWith(frag);
}

async function appendChapter(chapter, { scrollToPage = null, skipPages = 0 } = {}) {
  loadMoreObserver.disconnect();

  const res = await fetch(`/api/chapters/${encodeURIComponent(chapter.id)}/pages`);
  const data = await res.json();
  const pageCount = data.page_count || 0;
  const startPage = Math.min(skipPages, Math.max(pageCount - 1, 0));

  if (startPage > 0) {
    const wrap = document.createElement("div");
    wrap.className = "overlap-reveal-wrap";
    const revealBtn = document.createElement("button");
    revealBtn.className = "overlap-reveal-btn";
    revealBtn.title = "이전 화와 겹치는 페이지 펼쳐보기";
    revealBtn.setAttribute("aria-label", "건너뛴 페이지 펼쳐보기");
    revealBtn.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="6 9 12 15 18 9"></polyline></svg>';
    revealBtn.addEventListener("click", () => revealSkippedPages(chapter, startPage, wrap));
    wrap.appendChild(revealBtn);
    pagesEl.appendChild(wrap);
  }

  let targetImg = null;
  let lastImg = null;
  let firstImg = null;
  for (let i = startPage; i < pageCount; i++) {
    const img = document.createElement("img");
    img.dataset.chapter = chapter.id;
    img.dataset.page = String(i);
    img.dataset.key = `${chapter.id}:${i}`;
    img.src = `/api/chapters/${encodeURIComponent(chapter.id)}/pages/${i}`;
    img.alt = `${i + 1}페이지`;
    pagesEl.appendChild(img);
    pageObserver.observe(img);
    lastImg = img;
    if (i === startPage) firstImg = img;
    if (scrollToPage !== null && i === scrollToPage) targetImg = img;
  }

  loadedChapters.push({ id: chapter.id, pageCount, firstImg });

  if (targetImg) {
    const scrollNow = () => {
      targetImg.scrollIntoView({ block: "start" });
      revealPages();
    };
    if (targetImg.complete) {
      scrollNow();
    } else {
      targetImg.addEventListener("load", scrollNow, { once: true });
      targetImg.addEventListener("error", revealPages, { once: true });
      // 안전장치: 이미지가 너무 오래 걸리면 무한정 가려두지 않고 그냥 보여줌
      positioningTimer = setTimeout(revealPages, 4000);
    }
  } else if (pagesEl.classList.contains("positioning")) {
    revealPages();
  }

  const idx = chapterIndexById(chapter.id);
  const hasNext = idx >= 0 && idx < seriesData.chapters.length - 1;
  if (hasNext && lastImg) {
    loadMoreObserver.observe(lastImg);
    prefetchNextChapter(chapter.id); // 지금 화가 화면에 붙는 즉시 다음 화 앞부분을 미리 받아둠
  } else if (!hasNext) {
    appendEndCard();
  }
}

async function loadNextChapter() {
  if (isLoadingNext) return;
  const last = loadedChapters[loadedChapters.length - 1];
  if (!last) return;
  const idx = chapterIndexById(last.id);
  const next = idx >= 0 ? seriesData.chapters[idx + 1] : null;
  if (!next) return;
  isLoadingNext = true;
  try {
    let skipPages = 0;
    try {
      const res = await fetch(`/api/chapters/${encodeURIComponent(next.id)}/overlap`);
      if (res.ok) {
        const overlapData = await res.json();
        skipPages = overlapData.skip_pages || 0;
      }
    } catch (e) {
      // 겹침 조회 실패해도 그냥 처음부터 보여주면 됨
    }
    await appendChapter(next, { skipPages });
  } finally {
    isLoadingNext = false;
  }
}

function appendEndCard() {
  const el = document.createElement("div");
  el.className = "next-chapter";
  el.innerHTML = `
    <a class="next-card" href="/">
      <span class="eyebrow">마지막 화입니다</span>
      <span class="next-title">웹툰 목록으로 →</span>
    </a>
  `;
  pagesEl.appendChild(el);
}

// ---------------------------------------------------------------------
// 사이드 회차 패널
// ---------------------------------------------------------------------

function renderSidebar() {
  const ordered = seriesData.chapters; // 오름차순 그대로: 최신화가 맨 아래로
  sidebarListEl.innerHTML = "";
  ordered.forEach((ch, idx) => {
    const row = document.createElement("div");
    row.className = "sidebar-row";
    row.dataset.chapterId = ch.id;
    row.dataset.idx = String(idx);
    row.innerHTML = `
      <span class="sidebar-row-label">${ch.label}</span>
      <span class="sidebar-row-status"></span>
    `;
    row.addEventListener("click", () => jumpToChapter(ch));
    sidebarListEl.appendChild(row);
  });
  highlightSidebar();
}

function highlightSidebar() {
  // currentChapterId 기준으로 이전 회차는 "읽음", 그 회차는 "읽는 중"으로 표시.
  // 스크롤로 자연스럽게 진행 중이든, 사이드바에서 직접 건너뛰었든 동일한 기준.
  const readIndex = chapterIndexById(currentChapterId);
  for (const row of sidebarListEl.querySelectorAll(".sidebar-row")) {
    const idx = parseInt(row.dataset.idx, 10);
    row.classList.toggle("active", row.dataset.chapterId === currentChapterId);

    const statusEl = row.querySelector(".sidebar-row-status");
    if (readIndex < 0) {
      statusEl.textContent = "";
      statusEl.className = "sidebar-row-status";
    } else if (idx < readIndex) {
      statusEl.textContent = "읽음";
      statusEl.className = "sidebar-row-status read";
    } else if (idx === readIndex) {
      statusEl.textContent = "읽는 중";
      statusEl.className = "sidebar-row-status reading";
    } else {
      statusEl.textContent = "";
      statusEl.className = "sidebar-row-status";
    }
  }
}

function updateUrlState(chapterId, page) {
  const p = new URLSearchParams(location.search);
  p.set("series", seriesId);
  p.set("chapter", chapterId);
  p.set("page", String(page));
  history.replaceState(null, "", `${location.pathname}?${p.toString()}`);
}

async function jumpToChapter(ch) {
  // 새로고침(페이지 이동) 없이 그 회차로 이동. 이전 회차는 읽음, 이 회차는 읽는 중,
  // 이후 회차는 안읽음으로 사이드바에 즉시 반영되고, 서버에도 같은 방식으로 저장됨.
  currentChapterId = ch.id;
  currentPageIndex = 0;
  chapterTitleEl.textContent = `${seriesData.title} · ${ch.label}`;
  highlightSidebar();
  scheduleSaveProgress();
  updateUrlState(ch.id, 0);
  closeSidebar();

  const alreadyLoaded = loadedChapters.some((c) => c.id === ch.id);
  if (alreadyLoaded) {
    const target = document.querySelector(`img[data-chapter="${ch.id}"][data-page="0"]`);
    if (target) target.scrollIntoView({ block: "start" });
    return;
  }

  // 아직 로드 안 된(이전/이후 상관없이) 회차 -> 새로고침 대신 이 회차부터 다시 구성
  pageObserver.disconnect();
  loadMoreObserver.disconnect();
  visiblePages.clear();
  pagesEl.innerHTML = "";
  loadedChapters = [];
  isLoadingNext = false;

  beginPositioning();
  await appendChapter(ch, { scrollToPage: 0 });
}

function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebarOverlay").classList.add("open");
  const active = sidebarListEl.querySelector(".sidebar-row.active");
  if (active) active.scrollIntoView({ block: "center" });
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("open");
}

document.getElementById("sidebarToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);

// ---------------------------------------------------------------------
// 상단바 자동 숨김 + 화면 클릭 시 토글
// ---------------------------------------------------------------------

let lastY = window.scrollY;
const topbar = document.getElementById("topbar");
window.addEventListener(
  "scroll",
  () => {
    const y = window.scrollY;
    if (y > lastY && y > 80) topbar.classList.add("hidden");
    else topbar.classList.remove("hidden");
    lastY = y;
  },
  { passive: true }
);

pagesEl.addEventListener("click", (e) => {
  const link = e.target.closest("a");
  if (link && link.getAttribute("href") === "/") {
    // 마지막 화의 "웹툰 목록으로" 링크로 나갈 때도 전체 화면을 확실히 해제한다.
    e.preventDefault();
    leaveReaderForList(e);
    return;
  }
  // 링크(다음 화 카드 등) 클릭은 그대로 이동하도록 두고 토글만 별도로 처리
  topbar.classList.toggle("hidden");
});

// ---------------------------------------------------------------------
// 초기 로딩
// ---------------------------------------------------------------------

async function load() {
  if (!seriesId || !initialChapterId) return showError();

  await readFullscreenPreference();
  if (fullscreenPreference) {
    // CSS 기반 리더 전체 화면은 자동 적용할 수 있다. 브라우저의 실제 전체 화면 API는
    // 보안상 사용자 제스처가 필요할 수 있으므로, 여기서는 가능한 경우에만 시도한다.
    setReaderFullscreen(true, { persist: false, requestBrowserFullscreen: true });
  } else {
    updateFullscreenButton();
  }

  const res = await fetch(`/api/series/${encodeURIComponent(seriesId)}/chapters`);
  if (!res.ok) return showError();
  seriesData = await res.json();

  document.title = seriesData.title;
  document.getElementById("sidebarTitle").textContent = seriesData.title;
  renderSidebar();

  const startChapter = chapterById(initialChapterId) || seriesData.chapters[0];
  if (!startChapter) return showError();

  currentChapterId = startChapter.id;
  currentPageIndex = initialPage;
  chapterTitleEl.textContent = `${seriesData.title} · ${startChapter.label}`;
  highlightSidebar();

  if (initialPage > 0) beginPositioning();

  await appendChapter(startChapter, { scrollToPage: initialPage });
}

load();
</script>
</body>
</html>
