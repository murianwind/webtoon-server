<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 웹툰</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="웹툰">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>내 웹툰</h1>
  <span id="scanStatusText" class="scan-status-text"></span>
  <button id="settingsBtn" class="rescan-btn" title="라이브러리/백업 설정" aria-label="설정">⚙</button>
  <button id="rescanBtn" class="rescan-btn" title="새로고침(재스캔)" aria-label="재스캔">⟳</button>
</header>
<div class="toolbar">
  <input id="searchInput" class="search-input" type="text" placeholder="제목 검색">
  <select id="sortSelect" class="sort-select">
    <option value="latest">최근 업데이트순</option>
    <option value="unread">안읽은 회차 많은순</option>
    <option value="title">제목순</option>
  </select>
</div>
<div id="filterTabs" class="filter-tabs"></div>

<aside id="settingsPanel" class="sidebar">
  <div class="sidebar-header">
    <span>시리즈 폴더 / 백업</span>
    <button id="settingsClose" class="sidebar-close" aria-label="닫기">×</button>
  </div>
  <div id="settingsBody" class="settings-panel-body">
    <div class="settings-section">
      <div class="settings-section-title">스캔 중인 시리즈 폴더</div>
      <div id="includedFolderList" class="lib-list"></div>
      <div class="settings-hint">웹툰이 아닌 폴더가 섞여 있으면 "제외"를 눌러 스캔에서 뺄 수 있습니다.
      제외해도 실제 폴더나 zip 파일은 절대 지워지지 않습니다.</div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">제외된 폴더</div>
      <div id="excludedFolderList" class="lib-list"></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">리더 설정 범위</div>
      <div class="settings-hint">전체화면 / 스크롤 속도 / 확대·축소 값을 어디서 바꾸든 모든 웹툰에
      똑같이 적용할지, 웹툰마다 따로 기억할지 정합니다.</div>
      <div class="scope-toggle-buttons">
        <button id="scopeGlobalBtn" class="scope-btn" data-scope="global">전체 공통</button>
        <button id="scopePerSeriesBtn" class="scope-btn" data-scope="per_series">웹툰별로 따로</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">백업 / 복원</div>
      <div class="settings-hint">읽음 진행률, 검색/정렬/필터 설정, 제외된 폴더 목록을 전부 포함합니다.</div>
      <div class="read-action-picker-buttons">
        <a id="backupBtn" href="/api/backup" class="mark-all-btn" download>백업 다운로드</a>
        <button id="restoreBtn" class="mark-all-btn ghost">복원</button>
      </div>
      <input id="restoreFileInput" type="file" accept="application/json" style="display:none">
    </div>
  </div>
</aside>
<div id="settingsOverlay" class="sidebar-overlay"></div>

<aside id="chapterSidebar" class="sidebar">
  <div class="sidebar-header">
    <span id="chapterSidebarTitle">회차 목록</span>
    <button id="chapterSidebarClose" class="sidebar-close" aria-label="닫기">×</button>
  </div>
  <div id="chapterSidebarInfo" class="series-info-panel" style="display:none"></div>
  <div id="chapterSidebarList" class="sidebar-list"></div>
</aside>
<div id="chapterSidebarOverlay" class="sidebar-overlay"></div>

<div id="readActionPanel" class="read-action-panel" style="display:none">
  <div class="read-action-header">
    <span id="readActionTitle"></span>
    <button id="readActionClose" class="read-action-close" aria-label="닫기">×</button>
  </div>
  <div id="readActionBody"></div>
</div>

<main id="grid" class="grid"></main>

<script>
const LS_QUERY = "webtoon:index:query";
const LS_SORT = "webtoon:index:sort";
const FILTER_KEY = "status_filter"; // 서버(app_settings)에 저장 -> 모든 기기에서 동일하게 적용
const PLATFORM_FILTER_KEY = "platform_filter"; // 위와 같은 이유로 서버에 저장
const STATUS_OPTIONS = [
  { value: "unread", label: "읽지 않음" },
  { value: "reading", label: "읽는 중" },
  { value: "done", label: "완독" },
];
const STATUS_VALUES = STATUS_OPTIONS.map((o) => o.value);

let allSeries = [];
let query = localStorage.getItem(LS_QUERY) || "";
let sortMode = localStorage.getItem(LS_SORT) || "latest";
let selectedStatuses = new Set(); // 비어있으면 "전체" (서버에서 로드되기 전까지의 기본값)
let selectedPlatforms = new Set(); // 비어있으면 "전체 플랫폼", 여러 개 동시 선택 가능
let knownPlatforms = []; // /library 바로 아래 폴더 이름 전체 (아직 스캔 안 끝난 것도 포함)

let selectedIds = new Set(); // 다중 선택

const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
searchInput.value = query;
sortSelect.value = sortMode;

function sortSeries(list) {
  const arr = [...list];
  if (sortMode === "latest") arr.sort((a, b) => b.latest_update - a.latest_update);
  else if (sortMode === "unread") arr.sort((a, b) => b.unread_count - a.unread_count);
  else if (sortMode === "title") arr.sort((a, b) => a.title.localeCompare(b.title, "ko"));
  return arr;
}

function seriesStatus(s) {
  if (s.unread_count >= s.chapter_count) return "unread"; // 아직 한 번도 안 읽음
  if (s.unread_count === 0) return "done"; // 전부 읽음
  return "reading"; // 일부만 읽음
}

function saveFilterSetting() {
  const value = selectedStatuses.size === 0 ? "all" : [...selectedStatuses].join(",");
  fetch(`/api/settings/${FILTER_KEY}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value }),
  }).catch(() => {});
}

function savePlatformFilterSetting() {
  const value = selectedPlatforms.size === 0 ? "" : [...selectedPlatforms].join(",");
  fetch(`/api/settings/${PLATFORM_FILTER_KEY}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value }),
  }).catch(() => {});
}

async function loadPlatformFilterSetting() {
  try {
    const res = await fetch(`/api/settings/${PLATFORM_FILTER_KEY}`);
    const data = await res.json();
    const parts = (data.value || "").split(",").filter(Boolean);
    selectedPlatforms = new Set(parts);
  } catch (e) {
    // 못 받아와도 기본값(전체)으로 계속 진행
  }
}

function renderFilterTabs() {
  const container = document.getElementById("filterTabs");
  container.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = "filter-tab" + (selectedStatuses.size === 0 ? " active" : "");
  allBtn.textContent = "전체";
  allBtn.addEventListener("click", () => {
    if (selectedStatuses.size === 0) return;
    selectedStatuses = new Set();
    renderFilterTabs();
    render();
    saveFilterSetting();
  });
  container.appendChild(allBtn);

  for (const opt of STATUS_OPTIONS) {
    const btn = document.createElement("button");
    btn.className = "filter-tab" + (selectedStatuses.has(opt.value) ? " active" : "");
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      if (selectedStatuses.has(opt.value)) selectedStatuses.delete(opt.value);
      else selectedStatuses.add(opt.value);
      // 세 상태를 전부 선택한 상태는 "전체"와 같으므로 자연스럽게 합쳐줌
      if (selectedStatuses.size === STATUS_OPTIONS.length) selectedStatuses = new Set();
      renderFilterTabs();
      render();
      saveFilterSetting();
    });
    container.appendChild(btn);
  }

  // docker-compose volumes에서 정한 플랫폼 태그(네이버/카카오 등) - 실제로 시리즈가
  // 뜬 플랫폼뿐 아니라, 아직 스캔 중이라 시리즈가 하나도 없는 플랫폼도 knownPlatforms로
  // 미리 알고 있으면 같이 보여준다 (네트워크 드라이브가 늦게 끝나도 탭 자체는 먼저 보이게)
  const platformSet = new Set();
  for (const s of allSeries) platformSet.add(s.platform);
  for (const p of knownPlatforms) platformSet.add(p);
  if (platformSet.size > 1) {
    const divider = document.createElement("span");
    divider.className = "filter-tab-divider";
    container.appendChild(divider);

    for (const platform of [...platformSet].sort((a, b) => a.localeCompare(b, "ko"))) {
      const btn = document.createElement("button");
      btn.className = "filter-tab platform-filter-tab" + (selectedPlatforms.has(platform) ? " active" : "");
      btn.textContent = platform;
      btn.addEventListener("click", () => {
        if (selectedPlatforms.has(platform)) selectedPlatforms.delete(platform);
        else selectedPlatforms.add(platform);
        // 전체 플랫폼을 다 선택한 상태는 "전체"와 같으므로 자연스럽게 합쳐줌
        if (selectedPlatforms.size === platformSet.size) selectedPlatforms = new Set();
        renderFilterTabs();
        render();
        savePlatformFilterSetting();
      });
      container.appendChild(btn);
    }
  }
}

function render() {
  const grid = document.getElementById("grid");
  const q = query.trim().toLowerCase();
  let filtered = q ? allSeries.filter((s) => s.title.toLowerCase().includes(q)) : allSeries;
  if (selectedStatuses.size > 0) {
    filtered = filtered.filter((s) => selectedStatuses.has(seriesStatus(s)));
  }
  if (selectedPlatforms.size > 0) {
    filtered = filtered.filter((s) => selectedPlatforms.has(s.platform));
  }
  const list = sortSeries(filtered);

  if (!list.length) {
    const msg = q
      ? "검색 결과가 없습니다."
      : selectedStatuses.size > 0 || selectedPlatforms.size > 0
      ? "해당하는 웹툰이 없습니다."
      : "스캔된 웹툰이 없습니다.<br>라이브러리 폴더를 확인해주세요.";
    grid.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }

  grid.innerHTML = "";
  for (const s of list) {
    const isSelected = selectedIds.has(s.id);
    const card = document.createElement("div");
    card.className = "card" + (isSelected ? " selected" : "");
    card.innerHTML = `
      <div class="cover-wrap">
        <span class="platform-tag">${s.platform}</span>
        ${s.unread_count > 0 ? `<span class="unread-badge">${s.unread_count}</span>` : ""}
        <img src="${s.cover_url}" alt="${s.title}" loading="lazy">
        <button class="chapter-list-toggle" title="회차 목록" aria-label="회차 목록">≡</button>
        <button class="select-toggle" title="읽음 상태 관리용 선택" aria-label="읽음 상태 관리용 선택">${isSelected ? "●" : "○"}</button>
      </div>
      <div class="title">${s.title}</div>
      <div class="chapter-count">${s.progress_display}</div>
    `;
    card.querySelector(".select-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      if (selectedIds.has(s.id)) selectedIds.delete(s.id);
      else selectedIds.add(s.id);
      renderActionPanel();
      render();
    });
    card.querySelector(".chapter-list-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      openChapterSidebar(s);
    });
    card.addEventListener("click", () => goContinue(s.id));
    grid.appendChild(card);
  }
}

async function goContinue(seriesId) {
  try {
    const res = await fetch(`/api/series/${encodeURIComponent(seriesId)}/continue`);
    if (!res.ok) throw new Error("continue lookup failed");
    const data = await res.json();
    location.href = `/reader.html?series=${encodeURIComponent(seriesId)}&chapter=${encodeURIComponent(data.chapter_id)}&page=${data.page_index}`;
  } catch (e) {
    // 이동 실패 시 아무것도 하지 않음 (콘솔에만 남김)
    console.error(e);
  }
}

// ---------------------------------------------------------------------
// 읽음/안읽음 처리 패널 (여러 웹툰 동시 선택 지원)
// ---------------------------------------------------------------------

function clearSelection() {
  selectedIds = new Set();
  renderActionPanel();
  render(); // 카드의 선택 표시(●)도 즉시 지워야 함
}

function renderActionPanel() {
  const panel = document.getElementById("readActionPanel");
  if (selectedIds.size === 0) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";

  const titles = [...selectedIds]
    .map((id) => (allSeries.find((s) => s.id === id) || {}).title)
    .filter(Boolean);
  document.getElementById("readActionTitle").textContent =
    titles.length <= 2 ? titles.join(", ") : `${titles.length}개 웹툰 선택됨`;

  const body = document.getElementById("readActionBody");

  body.innerHTML = `
    <div class="read-action-grid">
      <button data-act="all-read">전체 읽음으로 표시</button>
      <button data-act="all-unread">전체 읽지 않음으로 표시</button>
    </div>
  `;
  for (const btn of body.querySelectorAll("button[data-act]")) {
    btn.addEventListener("click", () => onActionButton(btn.dataset.act));
  }
}

async function putReadState(seriesId, body) {
  await fetch(`/api/series/${encodeURIComponent(seriesId)}/read-state`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

async function onActionButton(act) {
  const read = act === "all-read";
  await Promise.all(
    [...selectedIds].map((id) => putReadState(id, { scope: "all", read }))
  );
  clearSelection();
  await load();
}

document.getElementById("readActionClose").addEventListener("click", clearSelection);

// ---------------------------------------------------------------------
// 로딩 & 검색/정렬 (localStorage에 유지)
// ---------------------------------------------------------------------

async function loadFilterSetting() {
  try {
    const res = await fetch(`/api/settings/${FILTER_KEY}`);
    const data = await res.json();
    if (data.value && data.value !== "all") {
      const parts = data.value.split(",").filter((v) => STATUS_VALUES.includes(v));
      selectedStatuses = new Set(parts);
    }
  } catch (e) {
    // 실패 시 기본값(전체) 유지
  }
}

async function fetchSeries() {
  const grid = document.getElementById("grid");
  try {
    const res = await fetch("/api/series");
    allSeries = await res.json();
    return true;
  } catch (e) {
    grid.innerHTML = `<div class="empty-state">목록을 불러오지 못했습니다.</div>`;
    return false;
  }
}

async function fetchScanStatus() {
  try {
    const res = await fetch("/api/scan-status");
    const data = await res.json();
    document.getElementById("scanStatusText").textContent = data.last_scan_at
      ? `마지막 스캔 ${data.last_scan_at}`
      : "";
    knownPlatforms = data.platforms || [];
  } catch (e) {
    // 실패해도 조용히 무시 (표시만 안 될 뿐 기능엔 영향 없음)
  }
}

// 알고 있는 플랫폼(knownPlatforms) 중에 아직 시리즈가 하나도 안 뜬 게 있으면, 스캔이
// 마저 끝나는 대로 화면에 자동으로 채워지도록 몇 초마다 다시 불러온다. 전부 채워지거나
// 시도 횟수를 다 쓰면(네트워크 드라이브가 아예 비어있거나 실패한 경우 등, 무한정 돌지
// 않도록) 스스로 멈춘다.
let scanPollTimer = null;
let scanPollAttempts = 0;
const SCAN_POLL_MAX_ATTEMPTS = 40; // 3초 간격 * 40 = 최대 2분

function hasUnscannedKnownPlatform() {
  const scanned = new Set(allSeries.map((s) => s.platform));
  return knownPlatforms.some((p) => !scanned.has(p));
}

function stopScanPolling() {
  if (scanPollTimer) {
    clearInterval(scanPollTimer);
    scanPollTimer = null;
  }
}

function maybeStartScanPolling() {
  if (scanPollTimer || !hasUnscannedKnownPlatform()) return;
  scanPollAttempts = 0;
  scanPollTimer = setInterval(async () => {
    scanPollAttempts += 1;
    const ok = await fetchSeries();
    await fetchScanStatus();
    if (ok) {
      renderFilterTabs();
      render();
    }
    if (!hasUnscannedKnownPlatform() || scanPollAttempts >= SCAN_POLL_MAX_ATTEMPTS) {
      stopScanPolling();
    }
  }, 3000);
}

async function load() {
  const ok = await fetchSeries();
  if (ok) {
    renderFilterTabs(); // 재스캔으로 새 장르가 생겼을 수도 있으니 같이 갱신
    render();
  }
  await fetchScanStatus();
  renderFilterTabs(); // knownPlatforms가 갱신됐을 수 있으니 다시 그림
  maybeStartScanPolling();
}

async function init() {
  renderFilterTabs(); // 기본값(전체)으로 우선 표시
  const [ok] = await Promise.all([fetchSeries(), loadFilterSetting(), loadPlatformFilterSetting(), fetchScanStatus()]);
  renderFilterTabs(); // 서버 값(및 knownPlatforms) 반영해서 다시 그림
  if (ok) render();
  maybeStartScanPolling();
}

searchInput.addEventListener("input", (e) => {
  query = e.target.value;
  localStorage.setItem(LS_QUERY, query);
  render();
});
sortSelect.addEventListener("change", (e) => {
  sortMode = e.target.value;
  localStorage.setItem(LS_SORT, sortMode);
  render();
});

const rescanBtn = document.getElementById("rescanBtn");
rescanBtn.addEventListener("click", async () => {
  if (rescanBtn.disabled) return;
  rescanBtn.disabled = true;
  rescanBtn.classList.add("spinning");
  try {
    await fetch("/api/rescan", { method: "POST" });
    await load();
  } catch (e) {
    // 실패해도 조용히 무시 (다음에 다시 시도 가능)
  } finally {
    rescanBtn.disabled = false;
    rescanBtn.classList.remove("spinning");
  }
});

// ---------------------------------------------------------------------
// 설정 패널: 시리즈 폴더 제외/포함 + 백업/복원
// ---------------------------------------------------------------------

const settingsPanel = document.getElementById("settingsPanel");

function folderLabel(f) {
  return `${f.platform} / ${f.series}`;
}

function clearPlaceholder(container) {
  const placeholder = container.querySelector(".picker-loading, .empty-state");
  if (placeholder) placeholder.remove();
}

function maybeShowEmptyPlaceholder(container, message) {
  if (container.children.length === 0) {
    container.innerHTML = `<div class="picker-loading">${message}</div>`;
  }
}

function createFolderRow(f, included) {
  const row = document.createElement("div");
  row.className = "lib-row";
  const action = included ? "exclude" : "include";
  const label = included ? "제외" : "다시 추가";
  row.innerHTML = `
    <span class="lib-name">${folderLabel(f)}</span>
    <button class="lib-action-btn${included ? "" : " add"}" data-action="${action}">${label}</button>
  `;
  const btn = row.querySelector("button");
  btn.addEventListener("click", () => handleFolderToggle(f, included, row, btn));
  return row;
}

async function handleFolderToggle(f, wasIncluded, row, btn) {
  const action = wasIncluded ? "exclude" : "include";
  btn.disabled = true;
  try {
    const res = await fetch(`/api/series-folders/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ platform: f.platform, series: f.series }),
    });
    if (!res.ok) throw new Error("요청 실패");

    // 목록 전체를 다시 그리지 않고, 이 항목만 반대쪽 목록으로 옮김
    // (전체 재렌더링을 하면 스크롤 위치가 맨 위로 초기화되어 버림)
    const includedEl = document.getElementById("includedFolderList");
    const excludedEl = document.getElementById("excludedFolderList");
    const fromEl = wasIncluded ? includedEl : excludedEl;
    const toEl = wasIncluded ? excludedEl : includedEl;

    row.remove();
    maybeShowEmptyPlaceholder(fromEl, wasIncluded ? "스캔 중인 폴더가 없습니다." : "제외된 폴더가 없습니다.");

    clearPlaceholder(toEl);
    // 방금 옮겨진 항목이 눈에 잘 띄도록 맨 아래가 아니라 맨 위에 넣음
    toEl.prepend(createFolderRow(f, !wasIncluded));

    await load(); // 메인 시리즈 목록(그리드) 갱신
  } catch (e) {
    // 실패하면 그대로 둠 (버튼만 다시 활성화)
  } finally {
    btn.disabled = false;
  }
}

async function renderFolderLists() {
  const includedEl = document.getElementById("includedFolderList");
  const excludedEl = document.getElementById("excludedFolderList");
  includedEl.innerHTML = `<div class="picker-loading">불러오는 중...</div>`;
  excludedEl.innerHTML = "";

  let data;
  try {
    const res = await fetch("/api/series-folders");
    data = await res.json();
  } catch (e) {
    includedEl.innerHTML = `<div class="empty-state">불러오지 못했습니다.</div>`;
    return;
  }

  includedEl.innerHTML = "";
  if (data.included.length === 0) {
    includedEl.innerHTML = `<div class="picker-loading">스캔 중인 폴더가 없습니다.</div>`;
  }
  for (const f of data.included) {
    includedEl.appendChild(createFolderRow(f, true));
  }

  excludedEl.innerHTML = "";
  if (data.excluded.length === 0) {
    excludedEl.innerHTML = `<div class="picker-loading">제외된 폴더가 없습니다.</div>`;
  }
  for (const f of data.excluded) {
    excludedEl.appendChild(createFolderRow(f, false));
  }
}

const READER_SCOPE_SETTING_KEY = "reader_settings_scope";

async function renderReaderScopeButtons() {
  let scope = "global";
  try {
    const res = await fetch(`/api/settings/${READER_SCOPE_SETTING_KEY}`);
    const data = await res.json();
    if (data.value === "per_series") scope = "per_series";
  } catch (e) {
    // 못 받아와도 기본값(전체 공통)으로 표시
  }
  for (const btn of document.querySelectorAll(".scope-btn")) {
    btn.classList.toggle("active", btn.dataset.scope === scope);
  }
}

for (const btn of document.querySelectorAll(".scope-btn")) {
  btn.addEventListener("click", async () => {
    await fetch(`/api/settings/${READER_SCOPE_SETTING_KEY}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: btn.dataset.scope }),
    });
    renderReaderScopeButtons();
  });
}

function openSettingsPanel() {
  settingsPanel.classList.add("open");
  settingsOverlay.classList.add("open");
  renderFolderLists();
  renderReaderScopeButtons();
}
function closeSettingsPanel() {
  settingsPanel.classList.remove("open");
  settingsOverlay.classList.remove("open");
}

const settingsOverlay = document.getElementById("settingsOverlay");
document.getElementById("settingsBtn").addEventListener("click", () => {
  if (settingsPanel.classList.contains("open")) closeSettingsPanel();
  else openSettingsPanel();
});
document.getElementById("settingsClose").addEventListener("click", closeSettingsPanel);
settingsOverlay.addEventListener("click", closeSettingsPanel);

const restoreFileInput = document.getElementById("restoreFileInput");
document.getElementById("restoreBtn").addEventListener("click", () => {
  restoreFileInput.click();
});
restoreFileInput.addEventListener("change", async () => {
  const file = restoreFileInput.files[0];
  if (!file) return;
  if (!confirm("현재 저장된 읽음 진행률/설정을 백업 파일 내용으로 덮어씁니다. 계속할까요?")) {
    restoreFileInput.value = "";
    return;
  }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const res = await fetch("/api/restore", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error("restore failed");
    alert("복원이 완료되었습니다.");
    await load();
    await renderFolderLists();
  } catch (e) {
    alert("복원에 실패했습니다. 올바른 백업 파일인지 확인해주세요.");
  } finally {
    restoreFileInput.value = "";
  }
});

// ---------------------------------------------------------------------
// 회차 목록 사이드바 (페이지 이동 없이 목록 화면에서 바로 펼침)
// ---------------------------------------------------------------------

const chapterSidebar = document.getElementById("chapterSidebar");
const chapterSidebarOverlay = document.getElementById("chapterSidebarOverlay");
const chapterSidebarList = document.getElementById("chapterSidebarList");
const chapterSidebarTitle = document.getElementById("chapterSidebarTitle");

function positionChapterSidebarList(chapters) {
  if (!Array.isArray(chapters) || chapters.length === 0) return;

  // DOM 렌더링이 끝난 다음 실제 높이를 계산해야 정확한 스크롤 위치를 잡을 수 있음.
  requestAnimationFrame(() => {
    const container = chapterSidebarList;
    const rows = [...container.querySelectorAll(".sidebar-row")];
    if (!rows.length || container.scrollHeight <= container.clientHeight) return;

    const isCompleted = chapters.every((ch) => ch.read);
    if (isCompleted) {
      // 완독한 웹툰은 목록의 마지막 회차가 화면에 보이도록 끝으로 이동.
      rows[rows.length - 1].scrollIntoView({ block: "end", behavior: "auto" });
      return;
    }

    // 읽는 중 또는 읽지 않음 중 목록에서 가장 먼저 나오는 회차를 기준으로 중앙 정렬.
    // reading 상태가 없는 경우에도 첫 번째 미읽음 회차를 대상으로 한다.
    const firstUnfinishedChapter = chapters.find((ch) => !ch.read);
    if (!firstUnfinishedChapter) return;

    const target = rows.find((row) => row.dataset.chapterId === firstUnfinishedChapter.id);
    if (target) target.scrollIntoView({ block: "center", behavior: "auto" });
  });
}

async function openChapterSidebar(series) {
  chapterSidebarTitle.textContent = series.title;
  chapterSidebarList.innerHTML = `<div class="picker-loading">불러오는 중...</div>`;
  chapterSidebar.classList.add("open");
  chapterSidebarOverlay.classList.add("open");

  renderSeriesInfoPanel(series.id); // info.xml이 없으면(대부분의 네이버 등) 조용히 숨겨짐

  let data;
  try {
    const res = await fetch(`/api/series/${encodeURIComponent(series.id)}/chapters`);
    data = await res.json();
  } catch (e) {
    chapterSidebarList.innerHTML = `<div class="empty-state">회차 목록을 불러오지 못했습니다.</div>`;
    return;
  }

  chapterSidebarList.innerHTML = "";
  // 오름차순 그대로 (최신화가 맨 아래로) - 리더 화면 사이드바와 동일한 순서
  for (const ch of data.chapters) {
    const row = document.createElement("div");
    row.className = "sidebar-row";
    row.dataset.chapterId = ch.id;
    row.title = "클릭하면 읽음/안읽음이 바뀝니다";
    renderChapterRowStatus(row, ch);
    row.addEventListener("click", () => toggleChapterReadState(series.id, ch, row));
    chapterSidebarList.appendChild(row);
  }

  positionChapterSidebarList(data.chapters);
}

function renderChapterRowStatus(row, ch) {
  const statusText = ch.read ? "읽음" : ch.reading ? "읽는 중" : "";
  const statusClass = ch.read ? "read" : ch.reading ? "reading" : "";
  row.innerHTML = `
    <span class="sidebar-row-label">${ch.label}</span>
    <span class="sidebar-row-status${statusClass ? " " + statusClass : ""}">${statusText}</span>
  `;
}

async function toggleChapterReadState(seriesId, ch, row) {
  if (row.dataset.busy === "1") return; // 응답 오기 전 중복 클릭 방지
  row.dataset.busy = "1";
  try {
    const res = await fetch(
      `/api/series/${encodeURIComponent(seriesId)}/chapters/${encodeURIComponent(ch.id)}/toggle-read`,
      { method: "POST" }
    );
    if (!res.ok) throw new Error("toggle failed");
    const data = await res.json();
    ch.read = data.read;
    ch.reading = false; // 방금 상태를 바꿨으니 "읽는 중" 표시는 더 이상 유효하지 않음
    renderChapterRowStatus(row, ch);
    load(); // 메인 화면의 안읽음 배지/진행률도 갱신 (기다리지 않고 백그라운드로)
  } catch (e) {
    // 실패해도 조용히 무시 - 표시는 그대로 두고 다시 시도할 수 있게 함
  } finally {
    row.dataset.busy = "0";
  }
}

const chapterSidebarInfo = document.getElementById("chapterSidebarInfo");

async function renderSeriesInfoPanel(seriesId) {
  chapterSidebarInfo.style.display = "none";
  chapterSidebarInfo.innerHTML = "";
  let info;
  try {
    const res = await fetch(`/api/series/${encodeURIComponent(seriesId)}/info`);
    if (!res.ok) return; // info.xml 없는 시리즈(네이버 등) - 그냥 아무것도 안 보여줌
    info = await res.json();
  } catch (e) {
    return;
  }

  const rows = [];
  if (info.writer) rows.push(`<div class="series-info-row"><b>작가</b> ${info.writer}</div>`);
  if (info.cover_artist) rows.push(`<div class="series-info-row"><b>그림</b> ${info.cover_artist}</div>`);
  if (info.genre) rows.push(`<div class="series-info-row"><b>장르</b> ${info.genre}</div>`);
  if (info.age_rating) rows.push(`<div class="series-info-row"><b>연령등급</b> ${info.age_rating}</div>`);
  if (info.notes) rows.push(`<div class="series-info-row">${info.notes}</div>`);
  if (info.summary) rows.push(`<div class="series-info-summary">${info.summary.replace(/\s*\n\s*/g, " ").trim()}</div>`);
  if (info.web_url) rows.push(`<a class="series-info-link" href="${info.web_url}" target="_blank" rel="noopener">원작 페이지 열기 ↗</a>`);

  if (rows.length === 0) return;
  chapterSidebarInfo.innerHTML = rows.join("");
  chapterSidebarInfo.style.display = "block";
}

function closeChapterSidebar() {
  chapterSidebar.classList.remove("open");
  chapterSidebarOverlay.classList.remove("open");
}

document.getElementById("chapterSidebarClose").addEventListener("click", closeChapterSidebar);
chapterSidebarOverlay.addEventListener("click", closeChapterSidebar);

// 브라우저 자체 뒤로가기(bfcache)로 이 페이지에 돌아오면, 페이지가 새로 실행되지 않고
// 리더에서 나가기 전의 예전 화면을 메모리에서 그대로 복원해버려서 안읽음 개수 등이
// 갱신 안 된 채로 보인다. event.persisted가 true면 정확히 이 경우이므로, 그때만
// 최신 데이터를 다시 불러온다.
window.addEventListener("pageshow", (event) => {
  if (event.persisted) load();
});

init();
</script>
