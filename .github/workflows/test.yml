name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # build.yml에서 이 워크플로우를 재사용(호출)할 수 있게 함

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v
